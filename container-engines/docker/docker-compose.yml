# =============================================================================
# Beacyn — Docker Compose
#
# Container name : beacyn-docker-1.0
# Usage          : docker compose --env-file .env.docker up -d
# Build          : docker compose --env-file .env.docker build
# Logs           : docker compose logs -f
# Stop           : docker compose down
# Full reset     : docker compose down -v   (⚠ deletes DB data)
# =============================================================================

name: beacyn

services:

  # ── Application ─────────────────────────────────────────────────────────────
  app:
    container_name: beacyn-docker-1.0
    image: beacyn-app:2.0.1
    build:
      context: ../../
      dockerfile: container-engines/docker/Dockerfile
      args:
        # Baked into the JS bundle — set to the URL users will reach the API from
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5145}
        VITE_APP_URL:      ${VITE_APP_URL:-http://localhost:7145}
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5145}:5145"    # Express backend API
      - "${FRONTEND_PORT:-7145}:7145"   # Vite preview (compiled frontend)
    environment:
      NODE_ENV:               production
      EULA_ACCEPTED:          "true"

      # Database (points to the sibling beacyn-db service)
      DB_HOST:                beacyn-db
      DB_PORT:                "3306"
      DB_USER:                root
      DB_PASSWORD:            ${MYSQL_ROOT_PASSWORD:-Password@123}
      DB_NAME:                ${DB_NAME:-pulseiq}
      INFRA_DB_NAME:          ${INFRA_DB_NAME:-bsa}
      DB_SSL:                 "false"
      DB_SSL_REJECT_UNAUTHORIZED: "false"

      # Runtime URLs
      VITE_APP_URL:           ${VITE_APP_URL:-http://localhost:7145}
      PULSE_API_BASE_URL:     ${VITE_API_BASE_URL:-http://localhost:5145}

      # SNMP
      SNMP_TRAP_ENABLED:      ${SNMP_TRAP_ENABLED:-true}
      SNMP_TRAP_BIND_HOST:    "0.0.0.0"
      SNMP_TRAP_PORT:         ${SNMP_TRAP_PORT:-9162}
      SNMP_COMMUNITY:         ${SNMP_COMMUNITY:-public}

      # Syslog collectors
      SYSLOG_ENABLED:         ${SYSLOG_ENABLED:-true}
      SYSLOG_BIND_HOST:       "0.0.0.0"
      SYSLOG_UDP_PORT:        ${SYSLOG_UDP_PORT:-5514}
      SYSLOG_TCP_PORT:        ${SYSLOG_TCP_PORT:-5514}

      # Optional — AI observability
      OBSERVABILITY_AI_ENABLED: ${OBSERVABILITY_AI_ENABLED:-false}
      OPENAI_API_KEY:           ${OPENAI_API_KEY:-}
      OPENAI_MODEL:             ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY:           ${GEMINI_API_KEY:-}
      GEMINI_MODEL:             ${GEMINI_MODEL:-gemini-2.5-pro}

      # Optional — ServiceNow integration
      SNOW_INSTANCE_URL:      ${SNOW_INSTANCE_URL:-}
      SNOW_USERNAME:          ${SNOW_USERNAME:-}
      SNOW_PASSWORD:          ${SNOW_PASSWORD:-}
      SNOW_ASSIGNMENT_GROUP:  ${SNOW_ASSIGNMENT_GROUP:-}

    depends_on:
      beacyn-db:
        condition: service_healthy
    networks:
      - beacyn-net

  # ── MySQL 8 ──────────────────────────────────────────────────────────────────
  beacyn-db:
    container_name: beacyn-mysql-1.0
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Password@123}
      MYSQL_DATABASE:      ${DB_NAME:-pulseiq}
    # Init scripts run once on first start (when data volume is empty)
    # 01-init-bsa.sql creates the `bsa` agent-infrastructure database and grants
    # the application user full access to it.
    volumes:
      - beacyn-mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    # Expose on a non-standard host port to avoid clashing with a local MySQL instance
    ports:
      - "${DB_EXPOSE_PORT:-3316}:3306"
    networks:
      - beacyn-net
    healthcheck:
      test:         ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval:     10s
      timeout:      5s
      retries:      12
      start_period: 30s

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  beacyn-net:
    driver: bridge

# ─── Named volumes ────────────────────────────────────────────────────────────
volumes:
  beacyn-mysql-data:
    driver: local
