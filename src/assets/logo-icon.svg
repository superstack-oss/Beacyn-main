<svg viewBox="0 0 220 360" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7DD95D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BC566;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Vertical blue bar (top) -->
  <rect x="85" y="45" width="50" height="90" rx="8" fill="url(#blueGradient)" />

  <!-- Green swoosh/curved shape (left side) -->
  <path d="M 50 120 Q 45 160 70 200 Q 85 220 110 210 L 110 150 Q 90 145 50 120" fill="url(#greenGradient)" opacity="0.9" />

  <!-- Main blue circular ring -->
  <circle cx="110" cy="185" r="75" fill="none" stroke="url(#blueGradient)" stroke-width="28" />

  <!-- Inner white circle (creates the ring effect) -->
  <circle cx="110" cy="185" r="45" fill="white" />
</svg>