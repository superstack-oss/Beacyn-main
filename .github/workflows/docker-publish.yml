# Publishes superstackinc/beacyn when main changes.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME   Docker Hub user or organization name (superstackinc)
#   DOCKERHUB_TOKEN      Docker Hub access token with read/write on that repository
name: Publish Docker image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "db/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "deployment/docker/**"
      - "deployment/podman/Containerfile"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hardened Images
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            superstackinc/beacyn:latest
            superstackinc/beacyn:${{ steps.version.outputs.version }}
          build-args: |
            VITE_API_BASE_URL=http://localhost:5145
            VITE_APP_URL=http://localhost:7145
          cache-from: type=gha
          cache-to: type=gha,mode=max
