# =============================================================================
# Beacyn NGINX Reverse Proxy
#
# Supports:
# - Private/LAN exposure (HTTP)
# - Public exposure (HTTP + optional HTTPS)
# - Reverse proxy for frontend + backend API
#
# Routes:
#   /api/*   -> backend API  (app:5145)
#   /health  -> backend API  (app:5145/health)
#   /*       -> frontend     (app:7145)
# =============================================================================

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 4096;

  # Basic hardening
  server_tokens off;

  # Upstreams
  upstream beacyn_frontend {
    server app:7145;
    keepalive 64;
  }

  upstream beacyn_backend {
    server app:5145;
    keepalive 64;
  }

  # WebSocket support
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # ── Private / Public HTTP entrypoint ───────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Increase payload limits for API operations
    client_max_body_size 50m;

    # Common reverse proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Conservative proxy timeouts
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # API
    location /api/ {
      proxy_pass http://beacyn_backend;
    }

    # Health endpoint
    location = /health {
      proxy_pass http://beacyn_backend/health;
    }

    # Frontend
    location / {
      proxy_pass http://beacyn_frontend;
    }
  }

  # ── Optional HTTPS server (public internet) ────────────────────────────────
  # 1) Put cert files in /etc/nginx/certs/
  #    - cert.pem
  #    - key.pem
  # 2) Uncomment this server block.
  # 3) Consider redirecting HTTP -> HTTPS in the server above.
  #
  # server {
  #   listen 443 ssl http2;
  #   server_name your-domain.com;
  #
  #   ssl_certificate     /etc/nginx/certs/cert.pem;
  #   ssl_certificate_key /etc/nginx/certs/key.pem;
  #   ssl_session_timeout 1d;
  #   ssl_session_cache shared:SSL:10m;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   ssl_prefer_server_ciphers off;
  #
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  #
  #   client_max_body_size 50m;
  #
  #   proxy_http_version 1.1;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  #   proxy_set_header Upgrade $http_upgrade;
  #   proxy_set_header Connection $connection_upgrade;
  #
  #   location /api/ {
  #     proxy_pass http://beacyn_backend;
  #   }
  #
  #   location = /health {
  #     proxy_pass http://beacyn_backend/health;
  #   }
  #
  #   location / {
  #     proxy_pass http://beacyn_frontend;
  #   }
  # }
}
