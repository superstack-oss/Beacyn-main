# =============================================================================
# Beacyn — NGINX reverse proxy configuration
#
# Routes:
#   /api/*    → Express backend  (app:5145)
#   /health   → Express health   (app:5145)
#   /*        → Vite frontend    (app:7145)
#
# WebSocket:
#   The frontend uses WebSocket connections; Upgrade headers are forwarded.
#
# SSL (optional):
#   Uncomment the HTTPS server block below and mount your certs into
#   deployment/docker/nginx/certs/
#     cert.pem  — certificate chain
#     key.pem   — private key
# =============================================================================

worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    sendfile       on;
    keepalive_timeout 65;

    # Upstream: Express backend API
    upstream beacyn_backend {
        server app:5145;
    }

    # Upstream: Vite preview (compiled frontend)
    upstream beacyn_frontend {
        server app:7145;
    }

    # ── HTTP ─────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Increase buffer sizes for API responses
        proxy_buffers          8 16k;
        proxy_buffer_size      32k;
        client_max_body_size   50m;

        # WebSocket upgrade headers (used by the frontend)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Forward real IP
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ── Backend API ────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://beacyn_backend;
        }

        location /health {
            proxy_pass http://beacyn_backend/health;
        }

        # ── Frontend ───────────────────────────────────────────────────────
        location / {
            proxy_pass http://beacyn_frontend;
        }
    }

    # ── HTTPS (optional) ────────────────────────────────────────────────────
    # Uncomment and mount certs to deployment/docker/nginx/certs/
    #
    # server {
    #     listen 443 ssl;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/cert.pem;
    #     ssl_certificate_key /etc/nginx/certs/key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     proxy_http_version 1.1;
    #     proxy_set_header   Upgrade    $http_upgrade;
    #     proxy_set_header   Connection "upgrade";
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    #     client_max_body_size 50m;
    #
    #     location /api/ {
    #         proxy_pass http://beacyn_backend;
    #     }
    #     location /health {
    #         proxy_pass http://beacyn_backend/health;
    #     }
    #     location / {
    #         proxy_pass http://beacyn_frontend;
    #     }
    # }
}
